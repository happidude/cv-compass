plugins {
    id 'java'
    id 'com.diffplug.spotless' version '8.10.4'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.cvcompass'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springModulithVersion', "2.1.1")
}

configurations {
    mockitoAgent
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.modulith:spring-modulith-observability-api'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.modulith:spring-modulith-starter-jpa'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.springframework.modulith:spring-modulith-actuator'
    runtimeOnly 'org.springframework.modulith:spring-modulith-observability-core'
    runtimeOnly 'org.springframework.modulith:spring-modulith-runtime'
    annotationProcessor 'org.projectlombok:lombok'
    mockitoAgent('org.mockito:mockito-core') { transitive = false }
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-batch-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // Load instrumentation at startup instead of Mockito dynamically attaching.
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
    // Inline Mockito appends MockMethodDispatcher to the bootstrap loader.
    // CDS is incompatible with that setup; disable class sharing only in test JVMs.
    jvmArgs '-Xshare:off'
    // PostgreSQL JDBC must use a portable timezone rather than host aliases.
    systemProperty 'user.timezone', 'UTC'
}

// Report the exact deprecated API and source location on each Java compilation.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-Xlint:deprecation')
}

spotless {
    enforceCheck = true
    lineEndings = com.diffplug.spotless.LineEnding.PRESERVE
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        // Keep original static-import resolution in files whose javap changed after formatting.
        targetExclude '**/generated/**',
                'src/test/java/com/cvcompass/backend/DiskImportIntegrationTests.java',
                'src/test/java/com/cvcompass/backend/ingestion/controller/OcrWorkerControllerTests.java',
                'src/test/java/com/cvcompass/backend/ingestion/service/CvDocumentServiceTests.java',
                'src/test/java/com/cvcompass/backend/ingestion/service/OcrEnqueueTests.java',
                'src/test/java/com/cvcompass/backend/ingestion/service/OcrJobHeartbeatTests.java',
                'src/test/java/com/cvcompass/backend/ingestion/service/OcrWorkerServiceTests.java'
        googleJavaFormat('1.36.1').aosp().reflowLongStrings(false).reorderImports(false).formatJavadoc(false)
    }
}
