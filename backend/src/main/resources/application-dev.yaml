spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cv_compass}
    username: ${DB_USERNAME:cvcompass}
    password: ${DB_PASSWORD:cvcompass_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080