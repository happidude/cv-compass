spring:
  config:
    import: "optional:file:.env.properties"
  application:
    name: cv-compass-backend

  servlet:
    multipart:
      # Parser limits are derived from cv.batch by BatchMultipartConfiguration.
      file-size-threshold: 0
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
logging:
  level:
    root: ${CV_LOG_LEVEL:INFO}
  structured:
    format:
      console: ${CV_LOG_FORMAT:}
      file: ${CV_LOG_FORMAT:}
    json:
      rename:
        "[@timestamp]": timestamp
      add:
        service: ${spring.application.name}
  logback:
    rollingpolicy:
      max-file-size: ${CV_LOG_MAX_FILE_SIZE:10MB}
      max-history: ${CV_LOG_MAX_HISTORY:7}
      total-size-cap: ${CV_LOG_TOTAL_SIZE_CAP:100MB}
  pattern:
    console: &readable-log "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %level service=${spring.application.name} event=%X{event:--} correlationId=%X{correlationId:--} documentId=%X{documentId:--} jobId=%X{jobId:--} attemptId=%X{attemptId:--} workerId=%X{workerId:--} status=%X{status:--} storageKey=%X{storageKey:--} exceptionType=%X{exceptionType:--} applicationStack=%X{applicationStack:--} errorCode=%X{errorCode:-NONE} %logger{36} : %msg%n"
    file: *readable-log

# Explicit provider selection and root are mandatory; no production storage default.
cv:
  catalog:
    normalization:
      enabled: ${CV_CATALOG_NORMALIZATION_ENABLED:false}
      lease-duration: ${CV_CATALOG_NORMALIZATION_LEASE_DURATION:120s}
      retry-backoff: ${CV_CATALOG_NORMALIZATION_RETRY_BACKOFF:30s}
      backfill-delay: ${CV_CATALOG_NORMALIZATION_BACKFILL_DELAY:15m}
      batch-size: ${CV_CATALOG_NORMALIZATION_BATCH_SIZE:100}
      max-body-bytes: ${CV_CATALOG_NORMALIZATION_MAX_BODY_BYTES:65536}
      claim-max-items: ${CV_CATALOG_NORMALIZATION_CLAIM_MAX_ITEMS:50}
      max-field-code-points: ${CV_CATALOG_NORMALIZATION_MAX_FIELD_CODE_POINTS:255}
      candidate-scan-page-size: ${CV_CATALOG_NORMALIZATION_CANDIDATE_SCAN_PAGE_SIZE:100}
      max-attempts: ${CV_CATALOG_NORMALIZATION_MAX_ATTEMPTS:3}
      workers: {}
    import:
      max-entries: ${CV_CATALOG_IMPORT_MAX_ENTRIES:10000}
      max-aliases-per-entry: ${CV_CATALOG_IMPORT_MAX_ALIASES_PER_ENTRY:50}
    taxonomy:
      resource-path: ${CV_CATALOG_TAXONOMY_RESOURCE_PATH:classpath:catalog/taxonomy-v0.json}
      version-label: ${CV_CATALOG_TAXONOMY_VERSION_LABEL:cv-taxonomy/0}
  candidate:
    publication:
      enabled: ${CV_CANDIDATE_PUBLICATION_ENABLED:false}
      page-size: ${CV_CANDIDATE_PUBLICATION_PAGE_SIZE:50}
      concurrency: ${CV_CANDIDATE_PUBLICATION_CONCURRENCY:1}
      delay: ${CV_CANDIDATE_PUBLICATION_DELAY:10s}
      list-page-size: ${CV_CANDIDATE_LIST_PAGE_SIZE:20}
  mapping:
    enabled: ${CV_MAPPING_ENABLED:false}
    scan-page-size: ${CV_MAPPING_SCAN_PAGE_SIZE:100}
    reaper-page-size: ${CV_MAPPING_REAPER_PAGE_SIZE:100}
    concurrency: ${CV_MAPPING_CONCURRENCY:1}
    max-attempts: ${CV_MAPPING_MAX_ATTEMPTS:3}
    scan-delay: ${CV_MAPPING_SCAN_DELAY:30s}
    worker-delay: ${CV_MAPPING_WORKER_DELAY:1s}
    reaper-delay: ${CV_MAPPING_REAPER_DELAY:15s}
    lease-duration: ${CV_MAPPING_LEASE_DURATION:120s}
    hard-deadline: ${CV_MAPPING_HARD_DEADLINE:120s}
    retry-backoff: ${CV_MAPPING_RETRY_BACKOFF:30s}
    remote:
      enabled: ${CV_MAPPING_REMOTE_ENABLED:false}
      lease-duration: ${CV_MAPPING_REMOTE_LEASE_DURATION:120s}
      heartbeat-interval: ${CV_MAPPING_REMOTE_HEARTBEAT_INTERVAL:30s}
      hard-deadline: ${CV_MAPPING_REMOTE_HARD_DEADLINE:15m}
      reclaim-grace: ${CV_MAPPING_REMOTE_RECLAIM_GRACE:2m}
      control-body-bytes: ${CV_MAPPING_REMOTE_CONTROL_BODY_BYTES:16384}
      max-result-bytes: ${CV_MAPPING_REMOTE_MAX_RESULT_BYTES:1048576}
      workers: {}
  pagination:
    default-page-size: ${CV_API_DEFAULT_PAGE_SIZE:20}
    max-page-size: ${CV_API_MAX_PAGE_SIZE:100}
  upload:
    max-file-bytes: ${CV_UPLOAD_MAX_FILE_BYTES:10485760}
  ocr:
    enabled: ${CV_OCR_ENABLED:false}
    integration:
      enabled: ${CV_OCR_INTEGRATION_ENABLED:false}
      admission:
        mode: ${CV_OCR_ADMISSION_MODE:synthetic-only}
        local-profile-revision: ${CV_OCR_LOCAL_PROFILE_REVISION:}
      namespace: ${CV_OCR_SYNTHETIC_NAMESPACE:}
      synthetic-storage-root: ${CV_OCR_SYNTHETIC_STORAGE_ROOT:}
      control-body-bytes: ${CV_OCR_CONTROL_BODY_BYTES:16384}
      reaper-delay: ${CV_OCR_REAPER_DELAY:15s}
      download-timeout: ${CV_OCR_DOWNLOAD_TIMEOUT:60s}
      # Worker credential SHA256s, profile provenance and known fixture manifests
      # belong in an external operator-owned configuration file; never a public request.
    max-attempts: ${CV_OCR_MAX_ATTEMPTS:3}
    lease-duration: ${CV_OCR_LEASE_DURATION:120s}
    heartbeat-interval: ${CV_OCR_HEARTBEAT_INTERVAL:30s}
    attempt-timeout: ${CV_OCR_ATTEMPT_TIMEOUT:900s}
    quarantine-grace: ${CV_OCR_QUARANTINE_GRACE:60s}
    retry-backoffs: ${CV_OCR_RETRY_BACKOFFS:30s,120s}
    expiry-batch-size: ${CV_OCR_EXPIRY_BATCH_SIZE:50}
    max-pages: ${CV_OCR_MAX_PAGES:50}
    max-text-code-points: ${CV_OCR_MAX_TEXT_CODE_POINTS:50000}
    max-document-text: ${CV_OCR_MAX_DOCUMENT_TEXT:500000}
    max-result-bytes: ${CV_OCR_MAX_RESULT_BYTES:8388608}
    max-envelope-bytes: ${CV_OCR_MAX_ENVELOPE_BYTES:8454144}
  import:
    enabled: ${CV_IMPORT_ENABLED:false}
    provider: ${CV_IMPORT_PROVIDER:local}
    source-directory: ${CV_IMPORT_SOURCE_DIRECTORY:}
    processed-directory: ${CV_IMPORT_PROCESSED_DIRECTORY:}
    failed-directory: ${CV_IMPORT_FAILED_DIRECTORY:}
    scan-interval: ${CV_IMPORT_SCAN_INTERVAL:30s}
    stability-interval: ${CV_IMPORT_STABILITY_INTERVAL:10s}
    retry-backoff: ${CV_IMPORT_RETRY_BACKOFF:30s}
    max-attempts: ${CV_IMPORT_MAX_ATTEMPTS:3}
  batch:
    multipart-overhead-bytes: ${CV_MULTIPART_OVERHEAD_BYTES:1048576}
    max-files: ${CV_BATCH_MAX_FILES:10}
    max-file-bytes: ${CV_BATCH_MAX_FILE_BYTES:10485760}
  storage:
    provider: ${CV_STORAGE_PROVIDER:}
    local:
      root-directory: ${CV_STORAGE_ROOT:}

# Finite drain budget lets clients receive 413 after a moderately oversized chunked request.
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${CV_SESSION_SECURE:true}
        same-site: strict
  tomcat:
    max-swallow-size: 101MB
