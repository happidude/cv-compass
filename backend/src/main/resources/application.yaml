spring:
  config:
    import: "optional:file:.env.properties"
  application:
    name: cv-compass-backend

  servlet:
    multipart:
      # Parser limits are derived from cv.batch by BatchMultipartConfiguration.
      file-size-threshold: 0
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

# Explicit provider selection and root are mandatory; no production storage default.
cv:
  pagination:
    default-page-size: ${CV_API_DEFAULT_PAGE_SIZE:20}
    max-page-size: ${CV_API_MAX_PAGE_SIZE:100}
  upload:
    max-file-bytes: ${CV_UPLOAD_MAX_FILE_BYTES:10485760}
  ocr:
    enabled: ${CV_OCR_ENABLED:false}
    integration:
      enabled: ${CV_OCR_INTEGRATION_ENABLED:false}
      admission:
        mode: ${CV_OCR_ADMISSION_MODE:synthetic-only}
        local-profile-revision: ${CV_OCR_LOCAL_PROFILE_REVISION:}
      namespace: ${CV_OCR_SYNTHETIC_NAMESPACE:}
      synthetic-storage-root: ${CV_OCR_SYNTHETIC_STORAGE_ROOT:}
      control-body-bytes: ${CV_OCR_CONTROL_BODY_BYTES:16384}
      reaper-delay: ${CV_OCR_REAPER_DELAY:15s}
      download-timeout: ${CV_OCR_DOWNLOAD_TIMEOUT:60s}
      # Worker credential SHA256s, profile provenance and known fixture manifests
      # belong in an external operator-owned configuration file; never a public request.
    max-attempts: ${CV_OCR_MAX_ATTEMPTS:3}
    lease-duration: ${CV_OCR_LEASE_DURATION:120s}
    heartbeat-interval: ${CV_OCR_HEARTBEAT_INTERVAL:30s}
    attempt-timeout: ${CV_OCR_ATTEMPT_TIMEOUT:900s}
    quarantine-grace: ${CV_OCR_QUARANTINE_GRACE:60s}
    retry-backoffs: ${CV_OCR_RETRY_BACKOFFS:30s,120s}
    expiry-batch-size: ${CV_OCR_EXPIRY_BATCH_SIZE:50}
    max-pages: ${CV_OCR_MAX_PAGES:50}
    max-text-code-points: ${CV_OCR_MAX_TEXT_CODE_POINTS:50000}
    max-document-text: ${CV_OCR_MAX_DOCUMENT_TEXT:500000}
    max-result-bytes: ${CV_OCR_MAX_RESULT_BYTES:8388608}
    max-envelope-bytes: ${CV_OCR_MAX_ENVELOPE_BYTES:8454144}
  import:
    enabled: ${CV_IMPORT_ENABLED:false}
    provider: ${CV_IMPORT_PROVIDER:local}
    source-directory: ${CV_IMPORT_SOURCE_DIRECTORY:}
    processed-directory: ${CV_IMPORT_PROCESSED_DIRECTORY:}
    failed-directory: ${CV_IMPORT_FAILED_DIRECTORY:}
    batch-size: ${CV_IMPORT_BATCH_SIZE:10}
    scan-interval: ${CV_IMPORT_SCAN_INTERVAL:30s}
    stability-interval: ${CV_IMPORT_STABILITY_INTERVAL:10s}
    retry-backoff: ${CV_IMPORT_RETRY_BACKOFF:30s}
    max-attempts: ${CV_IMPORT_MAX_ATTEMPTS:3}
  batch:
    multipart-overhead-bytes: ${CV_MULTIPART_OVERHEAD_BYTES:1048576}
    max-files: ${CV_BATCH_MAX_FILES:10}
    max-file-bytes: ${CV_BATCH_MAX_FILE_BYTES:10485760}
  storage:
    provider: ${CV_STORAGE_PROVIDER:}
    local:
      root-directory: ${CV_STORAGE_ROOT:}

# Finite drain budget lets clients receive 413 after a moderately oversized chunked request.
server:
  tomcat:
    max-swallow-size: 101MB
