services:
  postgres:
    image: postgres:17
    container_name: cv-compass-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cv_compass
      POSTGRES_USER: cvcompass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvcompass_dev}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvcompass -d cv_compass"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: