Work only under the primary's exclusive write lease; report changed paths, source identity, checks and unresolved findings, then release the lease and stop.
CI/security-hook edits need an approved spec with exact paths and intent; record outside-scope proposals under Open Questions.
Merge, GitHub settings/branch protection/rulesets, repository secret creation/editing, releases/tags and production database/server/deployment operations are human-only; agents never perform them regardless of task authorization.
Do not expand scope, publish, delegate or start another task.
