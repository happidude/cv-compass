name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-check:
    name: Node 24 / Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node LTS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Clean locked install
        run: |
          mkdir -p .ci-reports
          node --version
          npm --version
          npm ci 2>&1 | tee .ci-reports/install.log
      - name: Typecheck, lint and format
        run: |
          npm run typecheck 2>&1 | tee .ci-reports/typecheck.log
          npm run lint 2>&1 | tee .ci-reports/lint.log
          npm run format:check 2>&1 | tee .ci-reports/format.log
      - name: Unit and HTTP boundary tests
        run: npm run test -- --reporter=default --reporter=junit --outputFile.junit=.ci-reports/unit-junit.xml 2>&1 | tee .ci-reports/unit.log
      - name: Production build
        run: npm run build 2>&1 | tee .ci-reports/build.log
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium 2>&1 | tee .ci-reports/browser-install.log
      - name: Browser tests
        run: npm run test:browser 2>&1 | tee .ci-reports/browser.log
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: frontend-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
          path: |
            frontend/.ci-reports/
            frontend/playwright-report/
            frontend/test-results/
