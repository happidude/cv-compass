name: Persistence CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-check:
    name: Java 25 / PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/cv_compass_ci
      TEST_DB_USERNAME: cvcompass_ci
      # Disposable service-container credential; never used by application environments.
      TEST_DB_PASSWORD: ci_test_only
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cv_compass_ci
          POSTGRES_USER: cvcompass_ci
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvcompass_ci -d cv_compass_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew
      - name: Verify persistence foundation
        run: ./gradlew check
