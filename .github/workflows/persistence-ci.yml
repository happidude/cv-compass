name: Persistence CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Scope and Flyway immutability
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # develop runs the backend job only when the diff touches backend, this workflow, CI scripts or
      # files outside backend/ that backend tests read (grep of backend/src, build files and gradle/:
      # frontend/tests/fixtures/llm-remote in LlmRemoteContractFixtures, worker/design in
      # OcrResultValidatorTests). main always runs. Add new cross-directory test inputs here.
      - name: Scope
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run=true
          targets_develop=false
          if [ "$EVENT" = pull_request ] && [ "$BASE_REF" = develop ]; then targets_develop=true; fi
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/develop ]; then targets_develop=true; fi
          if [ "$targets_develop" = true ]; then
            base_sha=""
            head_sha="$HEAD_SHA"
            if [ "$EVENT" = pull_request ]; then
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
              if git rev-parse --verify --quiet "origin/$BASE_REF^{commit}" >/dev/null; then base_sha="origin/$BASE_REF"; fi
              base_sha=$(git merge-base "$base_sha" "$head_sha")
            elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$'; then
              base_sha="$PUSH_BEFORE"
            fi
            if [ -n "$base_sha" ] && git rev-parse --verify --quiet "$base_sha^{commit}" >/dev/null; then
              count=$(git diff --name-only "$base_sha..$head_sha" -- backend frontend/tests/fixtures/llm-remote worker/design .github/workflows/persistence-ci.yml scripts/ci | wc -l)
              echo "changed relevant paths: $count"
              if [ "$count" -eq 0 ]; then run=false; fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "scope decision: run=$run"
      - name: Test Flyway immutability check
        if: github.event_name == 'pull_request'
        run: bash scripts/ci/tests/test-check-flyway-immutable.sh
      - name: Check Flyway migrations are immutable
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Compare against the current base branch tip so versions added on it after branching count.
          base="$PR_BASE_SHA"
          if git rev-parse --verify --quiet "origin/$BASE_REF^{commit}" >/dev/null; then base="origin/$BASE_REF"; fi
          bash scripts/ci/check-flyway-immutable.sh "$base" "$HEAD_SHA"

  backend-check:
    name: Java 25 / PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.run == 'true'
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/cv_compass_ci
      TEST_DB_USERNAME: cvcompass_ci
      # Disposable service-container credential; never used by application environments.
      TEST_DB_PASSWORD: ci_test_only
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cv_compass_ci
          POSTGRES_USER: cvcompass_ci
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cvcompass_ci -d cv_compass_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew
      - name: Verify persistence foundation
        run: ./gradlew check
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-failure-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            backend/build/reports/**
            backend/build/test-results/**
